name: Production readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://scantapreviews.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for credentials
        run: pnpm check:secrets

      - name: Verify production contracts
        run: pnpm verify:production

      - name: Verify Supabase migrations and RLS contract
        run: pnpm verify:supabase

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build production application
        run: pnpm build
